<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Book | منصة تعليمية ذكية</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb"></div>
    <main class="app">
      <section id="loginScreen" class="card login-layout">
        <aside class="intro">
          <span class="logo-pill">AI Book</span>
          <h1>منصة مدرسية تفاعلية شاملة</h1>
          <p>
            فصول، منشورات، دردشات مباشرة، وإدارة مدرسية مع مساعد ذكي متكامل.
          </p>
        </aside>

        <section class="auth">
          <h2>تسجيل الدخول</h2>
          <div class="tabs">
            <button class="tab active" data-role="student">طالب</button>
            <button class="tab" data-role="teacher">معلم</button>
            <button class="tab" data-role="admin">إدارة</button>
          </div>

          <form id="loginForm" class="form">
            <label>الاسم الكامل
              <input id="fullName" type="text" required placeholder="الاسم الرباعي" />
            </label>

            <label id="studentIdWrap">ID الطالب
              <input id="studentId" type="text" placeholder="مثال ST1234" />
            </label>

            <label id="studentGradeWrap">الصف
              <select id="studentGrade"></select>
            </label>

            <label id="teacherEmailWrap" class="hidden">بريد المعلم
              <input id="teacherEmail" type="email" placeholder="teacher@school.edu" />
            </label>

            <label>كلمة المرور
              <input id="password" type="password" required placeholder="••••••••" />
            </label>

            <label id="teacherSecretWrap" class="hidden">الرقم السري للمعلم
              <input id="teacherSecret" type="password" maxlength="6" inputmode="numeric" placeholder="••••••" />
            </label>

            <div id="teacherAssignments" class="hidden"></div>

            <label id="adminSecretWrap" class="hidden">الرقم السري للإدارة
              <input id="adminSecret" type="password" maxlength="7" inputmode="numeric" placeholder="•••••••" />
            </label>

            <button class="btn primary" type="submit">دخول المنصة</button>
            <p id="loginMsg" class="msg"></p>
          </form>
        </section>
      </section>

      <section id="dashboard" class="hidden card">
        <header class="topbar">
          <div>
            <h2 id="welcome"></h2>
            <p id="subtitle"></p>
          </div>
          <button id="logoutBtn" class="btn danger">تسجيل خروج</button>
        </header>

        <div class="grid">
          <section class="panel">
            <h3>الفصول والمواد</h3>
            <ul id="classesList" class="list"></ul>
          </section>

          <section class="panel">
            <h3>المنشورات</h3>
            <div id="teacherPostBox" class="hidden compose">
              <label>الصف
                <select id="postGrade"></select>
              </label>
              <label>المادة
                <select id="postSubject"></select>
              </label>
              <textarea id="postText" placeholder="اكتب منشوراً للطلاب..."></textarea>
              <button id="publishTeacherPost" class="btn primary" type="button">نشر</button>
            </div>

            <div id="adminPostBox" class="hidden compose">
              <textarea id="adminPostText" placeholder="منشور عام يراه الجميع..."></textarea>
              <button id="publishAdminPost" class="btn primary" type="button">نشر عام</button>
            </div>

            <ul id="postList" class="list"></ul>
          </section>

          <section class="panel">
            <h3>الدردشات</h3>
            <div id="teacherChatTools" class="hidden compose">
              <input id="chatTitle" type="text" placeholder="اسم غرفة الدردشة" />
              <label>الصف
                <select id="chatGrade"></select>
              </label>
              <label>المادة
                <select id="chatSubject"></select>
              </label>
              <div class="row">
                <input id="memberSearch" type="text" placeholder="بحث بالاسم الرباعي أو ID" />
                <button id="doSearch" class="btn" type="button">بحث</button>
              </div>
              <ul id="searchResult" class="mini"></ul>
              <p>المشاركون:</p>
              <ul id="selectedMembers" class="mini"></ul>
              <button id="createChat" class="btn primary" type="button">إنشاء الغرفة</button>
            </div>

            <div class="chat-layout">
              <ul id="chatRooms" class="mini"></ul>
              <div id="chatConversation" class="conversation hidden">
                <h4 id="chatRoomTitle"></h4>
                <div id="chatMessages" class="messages"></div>
                <div class="row">
                  <input id="chatInput" type="text" placeholder="اكتب رسالة..." />
                  <button id="sendMessage" class="btn primary" type="button">إرسال</button>
                </div>
              </div>
            </div>
          </section>

          <section class="panel">
            <h3>المساعد الذكي (ChatGPT)</h3>
            <div class="compose">
              <input id="openaiKey" type="password" placeholder="OpenAI API Key (اختياري للحفظ محلياً)" />
              <input id="aiPrompt" type="text" placeholder="اكتب سؤالك..." />
              <button id="askAi" class="btn primary" type="button">اسأل</button>
            </div>
            <article id="aiAnswer" class="answer">جاهز للمساعدة.</article>
          </section>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
