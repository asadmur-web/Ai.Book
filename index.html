<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>موقع التعليم الشرعي الذكي</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orbs"></div>
  <header class="topbar">
    <div class="brand">
      <div class="logo">⚑</div>
      <div>
        <h1>موقع التعليم الشرعي الذكي</h1>
        <p>منصة مدرسية احترافية للطلاب والمعلمين والإدارة</p>
      </div>
    </div>
    <div id="sessionBox"></div>
  </header>

  <main id="app"></main>

  <template id="authTemplate">
    <section class="auth-grid">
      <article class="card glass">
        <h2>تسجيل حساب جديد</h2>
        <div class="tabs">
          <button data-tab="student" class="active">طالب</button>
          <button data-tab="teacher">معلم</button>
          <button data-tab="admin">إدارة مدرسية</button>
        </div>
        <form id="registerForm"></form>
      </article>

      <article class="card glass">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm" class="stack">
          <label>البريد الإلكتروني أو ID<input name="identifier" required /></label>
          <label>كلمة المرور<input name="password" type="password" required /></label>
          <button class="primary">دخول</button>
        </form>
        <p class="hint">إذا كان الحساب موجوداً مسبقاً سيتم توجيهك مباشرة لتسجيل الدخول.</p>
      </article>
    </section>
  </template>

  <template id="dashboardTemplate">
    <section class="dashboard">
      <aside class="sidebar card glass" id="sideMenu"></aside>
      <section class="content" id="content"></section>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
